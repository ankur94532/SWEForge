[project]
name = "sweforge"
version = "0.1.0"
description = "A small local software-engineering agent harness built on Deep Agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents>=0.7.0",
    "httpx>=0.28.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langchain-mcp-adapters>=0.3.0",
    "pyjwt[crypto]>=2.9.0",
]

[project.scripts]
sweforge = "sweforge.cli:main"
sweforge-github-poll = "sweforge.github_poll_cli:main"
sweforge-github-workflow = "sweforge.workflow_cli:main"
sweforge-github-execution = "sweforge.github_execution_cli:main"
sweforge-github-publish = "sweforge.github_publish_cli:main"
sweforge-serve = "sweforge.server_cli:main"
sweforge-repo-memory = "sweforge.repo_memory_cli:main"
sweforge-repo-skills = "sweforge.skills_cli:main"
sweforge-review-freeze = "sweforge.review_fixture_cli:freeze_main"
sweforge-review-replay = "sweforge.review_fixture_cli:replay_main"

[dependency-groups]
dev = [
    "langchain-openai>=1.6.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sweforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
