[project]
name = "sweforge-acceptance-sandbox"
version = "0.1.0"
description = "Operator-owned macOS Seatbelt sandbox backend for SWEForge acceptance"
requires-python = ">=3.12"

[project.entry-points."sweforge.sandbox_backends"]
acceptance-seatbelt = "sweforge_acceptance_sandbox:seatbelt_backend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sweforge_acceptance_sandbox"]
