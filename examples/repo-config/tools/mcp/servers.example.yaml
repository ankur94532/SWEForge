version: 1
servers:
  release-catalog:
    connection:
      transport: stdio
      command: python
      args: [/trusted/operator/path/release_catalog_server.py]
    tools: [lookup_release]
    secret_env:
      RELEASE_CATALOG_TOKEN: RELEASE_CATALOG_TOKEN
  remote-release-service:
    connection:
      transport: streamable_http
      url: https://mcp.example.invalid/mcp
    headers:
      X-Client-Version: sweforge-example
    secret_headers:
      Authorization: RELEASE_MCP_AUTH
    tools: [lookup_release]
